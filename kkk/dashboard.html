<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المعلم</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  main.wrap { align-items: flex-start; }
  .dash-card { max-width: 980px; }
</style>
</head>
<body>

  <div class="editor-tab">
    <span class="dot"></span>
    <span class="filename mono">teacher_dashboard.py</span>
  </div>

  <main class="wrap">
    <div class="card dash-card" id="dash">
      <h2>لوحة المعلم</h2>
      <label for="pw">كلمة السر</label>
      <input type="password" id="pw" placeholder="********" />
      <div id="dashError"></div>
      <div style="margin-top:1rem;">
        <button id="loadBtn">عرض النتائج</button>
        <button class="secondary" id="exportBtn" style="display:none;">تصدير CSV</button>
      </div>
      <div id="results"></div>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
